name = "futary-api"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

# 053: 独自ドメイン。Workers の Custom Domains（DNS と証明書は Cloudflare が作る。
# ゾーン nisoine.com が Active でないと wrangler deploy が失敗する）。
# 旧 URL（*.workers.dev）は残す（workers_dev = true）。旧 URL と www は
# Worker の先頭で nisoine.com へ 301 する（src/lib/canonical-host.ts）
workers_dev = true
routes = [
  { pattern = "nisoine.com", custom_domain = true },
  { pattern = "www.nisoine.com", custom_domain = true },
]

[[d1_databases]]
binding = "DB"
database_name = "futary-db"
database_id = "37d32e5d-80a9-4bc9-bae4-e7019bebd883"
migrations_dir = "../../packages/db/migrations"

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "futary-images"

# ランディングページ（apps/landing）とアプリ本体（apps/app の Web エクスポート。
# /app/* 配下）を合成した公開ディレクトリ（scripts/build-public.mjs が生成する。
# デプロイ前に `pnpm build:public` を実行しておく必要がある。015タスク定義）。
# 053 で run_worker_first を true にした（それまでは ["/api/*"]）。旧ホスト・www の
# `/`・`/app/*` を 301 するには Worker が先に受ける必要がある（配列だと、一致する
# アセットがあるパスは Worker を通らずに配信される）。静的アセットは Worker の
# 最後で ASSETS binding に渡す（src/index.ts）。apps/app は app.json で
# web.output="static"・experiments.baseUrl="/app" を設定しているため、動的
# セグメントの無いこのアプリでは全ルートが実ファイルとして書き出され、
# SPAフォールバックが要らない（binding 経由でも html_handling は効く）
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

# BETTER_AUTH_URL / TRUSTED_ORIGINS は [vars] に置かない。
# ここに置くと本番デプロイ時に上書きし忘れた場合、Cookie の Secure 属性が
# 落ちたり、開発用の localhost オリジンへの CORS が本番でも許可され続けるリスクがある
# （security-auditor 003監査 High/Medium指摘）。
# 値は .dev.vars（ローカル）と `wrangler secret put`（本番）で明示的に設定する運用にし、
# 未設定なら Worker が起動時エラーで落ちる（fail-closed）ようにする。

# DEMO_COUPLE_ID は機密情報ではない（architecture.md 8節）ので [vars] に置く。
# packages/db/seed/demo.ts の DEMO_COUPLE_ID 定数と一致していなければならない
# （014）。本番も同じ値をそのまま使う。シードの投入自体は016の人間パート
[vars]
DEMO_COUPLE_ID = "demo-couple"
# 037: AI_PROVIDER自体はopenai/anthropicの2値しか取らず機密情報ではない
# （DEMO_COUPLE_IDと同じ理由で[vars]に置く）。対応するAPIキー
# （OPENAI_API_KEY/ANTHROPIC_API_KEY）は機密情報のため.dev.vars/
# `wrangler secret put`で別途設定する
AI_PROVIDER = "openai"
# 048 段階2: Stripe の Price ID（price_… は秘密ではない。金額は Stripe から読む）。
# 価格を変えるときは Stripe で新しい Price を作ってここを差し替える（Price の金額は編集できない）。
# 今はテストモード（サンドボックス）の ID。本番の鍵に替えるとき本番の Price ID に差し替える（人間の手番）。
# 鍵（STRIPE_SECRET_KEY / STRIPE_WEBHOOK_SECRET）は .dev.vars / wrangler secret
STRIPE_PRICE_MONTHLY = "price_1UFvQA3ceREnadkKze57j8LK"
STRIPE_PRICE_YEARLY = "price_1UFvRG3ceREnadkKJCEsZ1LB"
