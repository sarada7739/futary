# Dependabot の設定（066）。セキュリティ更新はリポジトリの設定で有効にしてあり、勧告が出ると
# 自動で PR を作る。通常の版の更新は作らない（open-pull-requests-limit: 0）。
# 上げられない勧告は Dependabot の警告を理由付きで閉じる（security-requirements.md 9節）。`ignore` では赤は止まらない
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
