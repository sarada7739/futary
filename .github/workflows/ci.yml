name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    # gitleaks-action は PR のコミット一覧を取得するために pull-requests: read
    # を要求する（既定の GITHUB_TOKEN は contents: read のみで 403 になる）
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          # gitleaks-action が差分（PRのbase..head／pushのbefore..after）を
          # 計算するためにはコミット履歴が必要（shallow clone だと参照が無い）
          fetch-depth: 0

      - name: gitleaks（検出1件で赤。security-requirements.md 9節）
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # 出力専用（全重大度）。失敗させない。人間が読む前提の材料であり統制ではない
      # （security-requirements.md 9節「陳腐化の検出」）
      - name: pnpm audit（全重大度・出力のみ）
        run: pnpm audit || true

      # ゲート。high以上で赤（moderate以下は上の出力専用ステップに任せる）。
      # pnpm-workspace.yaml の auditConfig.ignoreGhsas（到達不能・修正版無しの
      # 勧告のみ、A の承認制）がここに効く
      - name: pnpm audit（high以上で赤。security-requirements.md 9節）
        run: pnpm audit --audit-level=high

      # 陳腐化の検出。無視リストの項目が、無視を外した状態のauditにまだ
      # 現れるかを見る。現れなくなっていたら（修正版が出た・依存が消えた等）
      # その項目はもう不要なので赤くする（security-requirements.md 9節）
      - name: pnpm audit（無視リストの陳腐化検出）
        run: node scripts/check-audit-ignore-staleness.mjs

      # drizzleのスナップショット（packages/db/migrations/meta/）と
      # スキーマ定義（packages/db/src/schema/）がずれていないかを見る
      # （architecture.md 4節「CIでdrizzle-kit generateを走らせ、新しい
      # ファイルが出ないことを確かめる」。021で実装すると書かれたまま
      # 021・022とも未実装だった分をここで閉じる）。git diffではなく
      # git statusを使う（git diffは未追跡ファイルを見ない。Rの指摘）
      - name: drizzle スナップショットとスキーマのずれ検出
        run: |
          pnpm run db:generate
          git status --porcelain packages/db
          test -z "$(git status --porcelain packages/db)" || exit 1

      - run: pnpm run type-check

      - run: pnpm run lint

      # CI にはローカル用の .dev.vars が無い。テストでは実際の Google 認証も
      # 実際の R2 への通信も行わない（署名付きURLの生成自体はネットワーク不要な
      # 計算のみ）ため、Better Auth・R2署名の初期化が通る程度のダミー値でよい
      - name: create test .dev.vars
        run: |
          cat > apps/api/.dev.vars << 'EOF'
          BETTER_AUTH_SECRET=ci-test-secret-not-used-in-production-32b
          GOOGLE_CLIENT_ID=ci-test-client-id
          GOOGLE_CLIENT_SECRET=ci-test-client-secret
          BETTER_AUTH_URL=http://localhost:8787
          TRUSTED_ORIGINS=http://localhost:8081
          R2_ACCOUNT_ID=ci-test-account-id
          R2_ACCESS_KEY_ID=ci-test-access-key-id
          R2_SECRET_ACCESS_KEY=ci-test-secret-access-key
          EOF

      - run: pnpm run test
