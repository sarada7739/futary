packages:
  - "apps/*"
  - "packages/*"
allowBuilds:
  esbuild: true
  workerd: true
minimumReleaseAgeExclude:
  - miniflare@5.20261001.0-alpha
  - wrangler@4.146.0
  - '@cloudflare/vitest-plugin@1.1.0'
  - '@better-auth/core@1.7.2'
  - '@better-auth/drizzle-adapter@1.7.2'
  - '@better-auth/kysely-adapter@1.7.2'
  - '@better-auth/memory-adapter@1.7.2'
  - '@better-auth/mongo-adapter@1.7.2'
  - '@better-auth/prisma-adapter@1.7.2'
  - '@better-auth/telemetry@1.7.2'
  - better-auth@1.7.2
  - '@better-auth/expo@1.7.2'
  - '@cloudflare/workerd-darwin-64@1.20261001.1'
  - '@cloudflare/workerd-darwin-arm64@1.20261001.1'
  - '@cloudflare/workerd-linux-64@1.20261001.1'
  - '@cloudflare/workerd-linux-arm64@1.20261001.1'
  - '@cloudflare/workerd-windows-64@1.20261001.1'
  - workerd@1.20261001.1
  - '@cloudflare/workers-types@5.20261001.1'
# L11・security-requirements.md 9節「修正版の無い勧告の扱い（無視リスト）」。
# 登録できるのは A だけ。B は自分を通すために足さない（塞がれたら A に上げる）。
# CIが陳腐化を検出する（scripts/check-audit-ignore-staleness.mjs。無視リストを
# 外した状態でも各項目がaudit結果に現れなくなったら赤にする）。
# 016のリリース前に全項目を再評価する
auditConfig:
  ignoreGhsas:
    # image-size 1.2.1（経路: @better-auth/expo -> expo -> @expo/cli -> react-native
    # -> metro@0.87 -> image-size）。ICNSパーサのDoS。修正版は 2.0.3 だが、metro@0.87 が
    # ^1.0.2 を宣言し require("image-size").default(content) で呼ぶので 2.x へ override
    # できない。Metro（開発時のバンドラ）経由のみで、Worker と配信アセットには含まれない。
    # metro が image-size ^2 を宣言したら（または image-size 1.x に修正版が出たら）消すこと
    - GHSA-w3rx-r6r6-pgpr
    # image-size（同上の経路）。JXL/HEIFパーサのDoS。到達可能性・削除条件は上と同じ
    - GHSA-5p2g-fcmc-qvqq
    # node-forge 1.4.0（経路: @better-auth/expo -> expo -> @expo/cli、および
    # @expo/cli -> @expo/code-signing-certificates）。RSA PKCS#1 v1.5 の署名検証の不備。
    # 修正版なし（<= 1.4.0 全部）。Expo の開発・ビルド時の道具だけで、Worker と配信アセットには
    # 含まれない。修正版が出たら（Expo が上げたら）消すこと
    - GHSA-86w9-cpqp-85rv
# 推移的依存の既知脆弱性への追随（security-requirements.md 9節 T7）。
# 修正版がある勧告は無視リストに入れず、ここで上げる。
overrides:
  # js-yaml GHSA-2883-xcg3-v3hh（merge key の CPU 消費）。経路:
  # @better-auth/expo -> expo -> @expo/cli -> @expo/xcpretty -> js-yaml。
  # 宣言範囲 ^4.1.0 は 4.3.2 を含むが、pnpm update は推移的依存を動かさない
  # ため override で固定する（実測: `pnpm update -r --depth=Infinity js-yaml`
  # で lockfile が変わらなかった）。Xcode ログ整形（iOS ビルド時）のみで、
  # デプロイ後の Worker と配信アセットには含まれない。
  # @expo/xcpretty が js-yaml>=4.3.2 を解決するようになったら消すこと
  "js-yaml@<4.3.2": "4.3.2"
